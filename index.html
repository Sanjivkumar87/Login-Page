<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Virtual Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Particle background -->
  <div id="particles-js"></div>

  <!-- Login Form -->
  <div class="form-box">
    <h2>LOGIN</h2>
    <p>Welcome back</p>

    <form id="loginForm">
      <div class="input-group">
        <input type="text" id="username" required class="input-field">
        <label for="username">Username</label>
        <div class="glow-line"></div>
      </div>

      <div class="input-group">
        <input type="password" id="password" required class="input-field">
        <label for="password">Password</label>
        <div class="glow-line"></div>
      </div>

      <button type="submit" class="login-btn"><span>SIGN IN</span></button>

      <div class="remember-forgot">
        <div class="remember">
          <input type="checkbox" id="remember">
          <label for="remember">Remember me</label>
        </div>
        <a href="#" class="forgot">Forgot Password?</a>
      </div>

      <div class="signup-link">Don't have an account? <a href="signup.html">Register</a></div>
    </form>
  </div>

  <!-- Scripts -->
   <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script src="particles.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
