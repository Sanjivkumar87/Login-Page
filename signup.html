<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Virtual Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Particle background -->
  <div id="particles-js"></div>

  <!-- Signup Form -->
  <div class="form-box">
    <h2>SIGN UP</h2>
    <p>Create your account</p>

    <form id="signupForm">
      <div class="input-group">
        <input type="text" id="newUsername" required class="input-field">
        <label for="newUsername">Username</label>
        <div class="glow-line"></div>
      </div>

      <div class="input-group">
        <input type="password" id="newPassword" required class="input-field">
        <label for="newPassword">Password</label>
        <div class="glow-line"></div>
      </div>

      <div class="input-group">
        <input type="password" id="confirmPassword" required class="input-field">
        <label for="confirmPassword">Confirm Password</label>
        <div class="glow-line"></div>
      </div>

      <button type="submit" class="login-btn"><span>REGISTER</span></button>

      <div class="signup-link">Already have an account? <a href="index.html">Login</a></div>
    </form>
  </div>

  <!-- Scripts -->
   <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script src="particles.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
